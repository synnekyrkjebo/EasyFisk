<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07513d">
  <title>Feed – EasyFisk</title>
  <link rel="stylesheet" href="../styles/main.css?v=20261007-3">
  <link rel="stylesheet" href="../styles/purchase.css?v=20261001-29">
  <link rel="stylesheet" href="../styles/tooltips.css?v=20261007-4">
  <link rel="stylesheet" href="../styles/community.css?v=20261007-7">
</head>
<body>
  <div class="purchase-page tickets-page">
    <header class="header">
      <a class="brand" href="index.html" aria-label="EasyFisk – gå til kartet">
        <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 25c5-8 13-12 23-10l8-5-2 10 6 6-9 1c-6 8-17 10-26 5l6-4-6-3Z"/>
          <circle cx="31" cy="19" r="1.5"/>
          <path d="M18 12c-2 6 0 12 5 16M12 37c4-1 8 0 11 3"/>
        </svg>
        <span>EasyFisk</span>
      </a>
      <button class="icon-button" aria-label="Varsler">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      </button>
    </header>
    <main class="purchase-main">
      <div class="feed-heading"><h1 class="chosen-place">Feed</h1>
        <button class="account-button follow-button" id="manage-follows" type="button" aria-label="Legg til venner" hidden data-help="Finn venner du vil følge."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 7v6M16 10h6"/></svg></button>
      </div>
      <section class="selection-card" id="feed-guest" hidden><h2>Følg livet langs elva</h2><p class="account-status">Logg inn for å se fangster fra venner du følger.</p><a class="continue-button" id="feed-login">Logg inn</a><a class="guest-return" id="feed-signup">Registrer bruker</a></section>
      <div id="feed-account" hidden>
        <div class="feed-tabs" id="feed-tabs" hidden role="tablist" aria-label="Velg feed"><button id="friends-tab" type="button" role="tab" aria-selected="true" aria-controls="feed-panel">Venner</button><button id="zones-tab" type="button" role="tab" aria-selected="false" aria-controls="feed-panel" tabindex="-1">Soner</button></div>
        <section id="feed-panel" role="tabpanel" aria-labelledby="friends-tab"><div id="zone-overview"></div><div id="feed-posts"></div></section>
      </div>
      <p class="account-status" id="feed-status" role="status"></p>
    </main>
    <nav class="bottom-nav" aria-label="Hovedmeny">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>
        <span>Kart</span>
      </a>
      <a class="nav-item" href="fiskekort.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zM13 6v12"/></svg>
        <span>Fiskekort</span>
      </a>
      <a class="nav-item nav-item--report" href="loggfor.html">
        <span class="report-button" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
        </span>
        <span>Rapporter</span>
      </a>
      <a class="nav-item active" href="feed.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-4 2.5-7 6-7s6 3 6 7M14 14c4-1 7 1.5 7 5"/></svg>
        <span>Feed</span>
      </a>
      <a class="nav-item" href="minside.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Min side</span>
      </a>
    </nav>
  </div>
  <dialog class="message-dialog" id="follow-dialog" aria-labelledby="follow-heading"><h2 id="follow-heading">Legg til venner</h2><label class="checkout-label" for="follow-search">Søk etter venner</label><input class="checkout-input" id="follow-search" type="search" placeholder="Navn"><h3>Venner</h3><div id="friend-options"></div><div id="follow-zone-section" hidden><h3>Soner</h3><div id="zone-options"></div></div><p id="follow-status" class="account-status" role="status"></p><button class="account-button dialog-cancel" id="close-follows" type="button">Ferdig</button></dialog>
  <script src="../scripts/data/fishing-places.js?v=20261001-7"></script>
  <script type="module" src="../scripts/pages/feed.js?v=20261007-8"></script>
  <script type="module" src="../scripts/shared/tooltips.js?v=20261007-8"></script>
  <script type="module" src="../scripts/shared/notifications.js?v=20261007-8"></script>
</body>
</html>
