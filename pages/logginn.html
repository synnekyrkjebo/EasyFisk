<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07513d">
  <title>Logg inn – EasyFisk</title>
  <link rel="stylesheet" href="../styles/main.css?v=20261001-21">
  <link rel="stylesheet" href="../styles/purchase.css?v=20261001-19">
</head>
<body>
  <div class="purchase-page">
    <header class="purchase-header">
      <a href="kjop.html" class="back-link" id="login-back" aria-label="Tilbake til bestillingen">←</a>
      <strong>Logg inn</strong><span>EasyFisk</span>
    </header>
    <main class="purchase-main">
      <h1 class="chosen-place">Logg inn</h1>
      <form class="selection-card" id="login-form">
        <dl class="profile-details">
          <div><dt>Navn</dt><dd id="demo-name"></dd></div>
          <div><dt>E-post</dt><dd id="demo-email"></dd></div>
          <div><dt>Telefonnummer</dt><dd id="demo-phone"></dd></div>
        </dl>
        <button class="continue-button" id="login-submit" type="submit">Logg inn</button>
        <p class="account-status" id="login-status" role="status"></p>
      </form>
      <a class="guest-return" id="signup-link" href="registrer.html">Opprett konto</a>
    </main>
  </div>
  <script type="module" src="../scripts/pages/login.js?v=20261001-23"></script>
</body>
</html>
