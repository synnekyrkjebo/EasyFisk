<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07513d">
  <title>Min side – EasyFisk</title>
  <link rel="stylesheet" href="styles.css?v=20261001-21">
  <link rel="stylesheet" href="kjop.css?v=20261001-29">
</head>
<body>
  <div class="purchase-page tickets-page">
    <header class="header">
      <a class="brand" href="index.html" aria-label="EasyFisk – gå til kartet">
        <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 25c5-8 13-12 23-10l8-5-2 10 6 6-9 1c-6 8-17 10-26 5l6-4-6-3Z"/>
          <circle cx="31" cy="19" r="1.5"/>
          <path d="M18 12c-2 6 0 12 5 16M12 37c4-1 8 0 11 3"/>
        </svg>
        <span>EasyFisk</span>
      </a>
      <button class="icon-button" aria-label="Varsler">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      </button>
    </header>
    <main class="purchase-main">
      <h1 class="chosen-place">Min side</h1>
      <section class="selection-card" id="profile-guest" hidden>
        <h2>Vil du logge inn eller registrere deg?</h2>
        <p class="account-status">Logg inn for å se profilen og fiskekortene dine.</p>
        <a class="continue-button" id="profile-login" href="logginn.html">Logg inn</a>
        <a class="guest-return" id="profile-signup" href="registrer.html">Registrer bruker</a>
      </section>
      <section class="selection-card" id="profile-account" hidden>
        <h2>Din profil</h2>
        <dl class="profile-details">
          <div><dt>Navn</dt><dd id="profile-name"></dd></div>
          <div><dt>E-post</dt><dd id="profile-email"></dd></div>
          <div><dt>Telefonnummer</dt><dd id="profile-phone"></dd></div>
        </dl>
        <a class="continue-button" href="fiskekort.html">Mine fiskekort</a>
      </section>
      <p class="account-status" id="profile-status" role="status"></p>
    </main>
    <nav class="bottom-nav" aria-label="Hovedmeny">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>
        <span>Kart</span>
      </a>
      <a class="nav-item" href="fiskekort.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zM13 6v12"/></svg>
        <span>Fiskekort</span>
      </a>
      <a class="nav-item nav-item--report" href="loggfor.html">
        <span class="report-button" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
        </span>
        <span>Loggfør</span>
      </a>
      <a class="nav-item" href="index.html#feed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c0-4 2.5-7 6-7s6 3 6 7M14 14c4-1 7 1.5 7 5"/></svg>
        <span>Feed</span>
      </a>
      <a class="nav-item active" href="minside.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Min side</span>
      </a>
    </nav>
  </div>
  <script type="module" src="minside.js?v=20261001-31"></script>
</body>
</html>
